name: SCHAL-TV Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test + APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Vérifier le catalogue
        run: |
          python3 tools/validate_catalog.py app/src/main/assets/schalom_catalog.json

      - name: Tests Kotlin
        run: gradle test --no-daemon

      - name: Compilation debug
        run: gradle assembleDebug --no-daemon

      - name: Compilation release
        run: gradle assembleRelease --no-daemon

      - name: Publier SCHAL-TV-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: SCHAL-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier SCHAL-TV-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: SCHAL-TV-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
